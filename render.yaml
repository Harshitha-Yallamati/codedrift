databases:
  - name: codedrift-postgres
    plan: free
    databaseName: codedrift
    user: codedrift

services:
  - type: keyvalue
    name: codedrift-redis
    plan: free
    ipAllowList: []

  - type: web
    name: codedrift-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: codedrift-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: codedrift-redis
          type: keyvalue
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FERNET_KEY
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_OAUTH_REDIRECT_URI
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: MODEL_STORAGE_DIR
        value: /data/models
    preDeployCommand: alembic upgrade head && python -m app.seed.sample_data

  - type: worker
    name: codedrift-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: celery -A app.core.celery_app worker --loglevel=info
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: codedrift-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: codedrift-redis
          type: keyvalue
          property: connectionString
      - key: SECRET_KEY
        sync: false
      - key: FERNET_KEY
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_OAUTH_REDIRECT_URI
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: MODEL_STORAGE_DIR
        value: /data/models

  - type: web
    name: codedrift-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
